version: '3.9'

services:
  # ===== INFRASTRUCTURE SERVICES (STAGING) =====
  
  postgres:
    image: postgres:15-alpine
    container_name: trading-postgres-staging
    hostname: postgres-staging
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading_db_staging
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data-staging:/var/lib/postgresql/data
      - ./deployments/docker/init_all_schemas.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - trading-network-staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_db_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: mongo:7-alpine
    container_name: trading-mongodb-staging
    hostname: mongodb-staging
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: trading_db_staging
    volumes:
      - mongodb-data-staging:/data/db
      - mongodb-config-staging:/data/configdb
    networks:
      - trading-network-staging
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trading-redis-staging
    hostname: redis-staging
    ports:
      - "6380:6379"
    volumes:
      - redis-data-staging:/data
    networks:
      - trading-network-staging
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: trading-kafka-staging
    hostname: kafka-staging
    ports:
      - "9093:9092"
      - "29093:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-staging:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-staging:9092,PLAINTEXT_HOST://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    depends_on:
      - zookeeper
    networks:
      - trading-network-staging
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: trading-zookeeper-staging
    hostname: zookeeper-staging
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper-data-staging:/var/lib/zookeeper/data
      - zookeeper-logs-staging:/var/lib/zookeeper/log
    networks:
      - trading-network-staging
    restart: unless-stopped

  # ===== APPLICATION SERVICES (STAGING) =====

  api-gateway:
    build:
      context: ./api/gateway
      dockerfile: Dockerfile
    container_name: trading-api-gateway-staging
    hostname: api-gateway-staging
    ports:
      - "8181:8081"
    env_file:
      - ./api/gateway/.env.staging
    environment:
      # Override with staging-specific values if needed
      ENVIRONMENT: staging
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-config:
        condition: service_started
    networks:
      - trading-network-staging
    restart: unless-stopped

  user-config:
    build:
      context: ./services/user-config
      dockerfile: Dockerfile
    container_name: trading-user-config-staging
    hostname: user-config-staging
    ports:
      - "50151:50051"
    env_file:
      - ./services/user-config/.env.staging
    environment:
      ENVIRONMENT: staging
      GRPC_PORT: 50051
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-network-staging
    restart: unless-stopped

  data-ingestion:
    build:
      context: ./services/data-ingestion
      dockerfile: Dockerfile
    container_name: trading-data-ingestion-staging
    hostname: data-ingestion-staging
    ports:
      - "50152:50052"
    env_file:
      - ./services/data-ingestion/.env.staging
    environment:
      ENVIRONMENT: staging
      GRPC_PORT: 50052
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - trading-network-staging
    restart: unless-stopped

  rules-engine:
    build:
      context: ./services/rules-engine
      dockerfile: Dockerfile
    container_name: trading-rules-engine-staging
    hostname: rules-engine-staging
    ports:
      - "50153:50053"
    env_file:
      - ./services/rules-engine/.env.staging
    environment:
      ENVIRONMENT: staging
      GRPC_PORT: 50053
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-network-staging
    restart: unless-stopped

  trade-execution:
    build:
      context: ./services/trade-execution
      dockerfile: Dockerfile
    container_name: trading-trade-execution-staging
    hostname: trade-execution-staging
    ports:
      - "50154:50054"
    env_file:
      - ./services/trade-execution/.env.staging
    environment:
      ENVIRONMENT: staging
      SERVICE_PORT: 50054
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - trading-network-staging
    restart: unless-stopped

  risk-management:
    build:
      context: ./services/risk-management
      dockerfile: Dockerfile
    container_name: trading-risk-management-staging
    hostname: risk-management-staging
    ports:
      - "50155:50055"
    env_file:
      - ./services/risk-management/.env.staging
    environment:
      ENVIRONMENT: staging
      SERVICE_PORT: 50055
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-network-staging
    restart: unless-stopped

volumes:
  mongodb-data-staging:
    driver: local
  mongodb-config-staging:
    driver: local
  redis-data-staging:
    driver: local
  zookeeper-data-staging:
    driver: local
  zookeeper-logs-staging:
    driver: local
