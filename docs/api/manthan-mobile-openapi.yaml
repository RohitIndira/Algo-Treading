# =============================================================================
# SECTION B — Codifi/Indira broker endpoints consumed internally
# =============================================================================
# These are NOT exposed directly to mobile. The mobile app talks ONLY to OUR
# backend (the endpoints under `paths:` above). OUR backend then talks to
# Codifi server-to-server using the broker JWT it holds for each user.
#
# Documented here so the backend team knows:
#   - which Codifi endpoints to call for which data
#   - the existing API surface they integrate with
#   - what's "already solved by Codifi" vs "we need to compute"
#
# Auth model:
#   Mobile sends our session cookie → gateway validates → reads broker JWT
#   from Redis → calls Codifi with Bearer token + appId/userId/source/sso
#   headers (full pattern documented at /docs/architecture/codifi-auth.md).
# =============================================================================
