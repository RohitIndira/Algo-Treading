# =============================================================================
# WEBSOCKET SPEC (not strictly OpenAPI — documented here for one-stop reference)
# =============================================================================
x-websocket:
  url: wss://api.stockk.trade/ws
  auth: |
    Connect with the session cookie OR pass ?token={sessionToken} in query.
    Server validates on upgrade and tracks per-user subscription set.

  protocol:
    subscribe:   '{ "op": "subscribe",   "topic": "<topic>" }'
    unsubscribe: '{ "op": "unsubscribe", "topic": "<topic>" }'
    push:        '{ "topic": "...", "ts": 1781509200000, "data": { ... } }'
    heartbeat:   'Server sends { "op": "ping" } every 30s. Client must reply { "op": "pong" } within 10s.'

  rateLimits:
    quotePushPerSymbolMs: 500
    maxSubscriptionsPerConnection: 200

  topics:
    account.summary:
      payload:
        currentValue: number
        totalPnL: { value: number, pct: number }
        todayPnL: { value: number, pct: number }
      usedOnScreens: [home_dashboard]

    account.margin:
      payload:
        availableMargin: number
        utilizedMargin: number
      usedOnScreens: [deploy_popup, change_allocation]

    market.indices:
      payload:
        - { name: string, value: number, change: number, changePct: number }
      usedOnScreens: [home_dashboard]

    market.quote.{symbol}:
      payload:
        symbol: string
        ltp: number
        change: number
        changePct: number
      usedOnScreens: [home_dashboard, open_positions, stock_pnl_drilldown]

    subscription.{id}.pnl:
      payload:
        netPnL: { value: number, pct: number }
        todayPnL: { value: number, pct: number }
      usedOnScreens: [live_algos_live, algo_details_live]

    subscription.{id}.positions:
      payload:
        - { symbol: string, qty: number, unrealizedPnL: number, ltp: number }
      usedOnScreens: [open_positions]

    subscription.{id}.timeline:
      payload: '<TimelineEvent>'
      usedOnScreens: [algo_timeline, algo_details_live]

    subscription.{id}.status:
      payload:
        status: 'LIVE | PAUSED | STOPPED'
        alerts:
          - { type: ACTION_REQUIRED, code: INSUFFICIENT_MARGIN, message: string }
      usedOnScreens: [live_algos_live, algo_details_live]

    notifications:
      payload: '<Notification>'
      usedOnScreens: [app-wide-bell-badge, notifications_center]

