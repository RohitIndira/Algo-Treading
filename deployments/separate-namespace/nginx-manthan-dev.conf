# manthan-dev.stockk.trade — reverse proxy for the fresh algo-dev CQRS stack
# (13.206.136.158). Mirrors the manthan.stockk.trade routing but adapted to the
# algo-dev service ports; there is no Next.js frontend on this box, so the
# catch-all routes to the Go api-gateway.
#
#   /api/v1/*, /livez /readyz /health   -> api-gateway     :8099
#   /ws/live-orders, /ws/paper-trades   -> trade-execution :8091
#   /ws/*  (other)                      -> api-gateway     :8099
#   /  (everything else)                -> api-gateway     :8099
#
# TLS via the existing *.stockk.trade wildcard cert already on this box.

server {
    listen 80;
    server_name manthan-dev.stockk.trade manthan.stockk.trade;
    return 301 https://$host$request_uri;
}

# Direct-IP access over plain HTTP for testing BEFORE DNS/TLS is set up.
# Hit http://13.206.136.158/livez etc. No cert needed (cert is domain-only).
server {
    listen 80;
    server_name 13.206.136.158;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    client_max_body_size 10m;

    location ~ ^/ws/(live-orders|paper-trades) {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
    location / { proxy_pass http://127.0.0.1:8099; }
}

server {
    listen 443 ssl http2;
    server_name manthan-dev.stockk.trade manthan.stockk.trade;

    ssl_certificate     /etc/nginx/ssl/stockktrade-fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/stockk-trade.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/manthan-dev_access.log;
    error_log  /var/log/nginx/manthan-dev_error.log;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    client_max_body_size 10m;

    # ── Go api-gateway REST + health probes ───────────────────────────────
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /livez   { proxy_pass http://127.0.0.1:8099; }
    location = /readyz  { proxy_pass http://127.0.0.1:8099; }
    location = /health  { proxy_pass http://127.0.0.1:8099; }

    # ── trade-execution WS: live-orders / paper-trades ────────────────────
    location ~ ^/ws/(live-orders|paper-trades) {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── any other WS → api-gateway ────────────────────────────────────────
    location ~ ^/ws/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── catch-all → api-gateway (no frontend on this box) ─────────────────
    location / {
        proxy_pass http://127.0.0.1:8099;
    }
}
