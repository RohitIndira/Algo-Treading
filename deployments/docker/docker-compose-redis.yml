version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ""
    volumes:
      - redis-data:/data
    networks:
      - trading-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: trading-redis-ui
    environment:
      - REDIS_HOSTS=local:trading-redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - trading-network
    restart: unless-stopped

volumes:
  redis-data:
    driver: local

networks:
  trading-network:
    name: trading-network
    driver: bridge
