services:
  postgres:
    image: postgres:15-alpine
    container_name: trading-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Bootstrap DB — created by the image's own entrypoint before the
      # init scripts below run. Every OTHER canonical DB is created by
      # init_databases.sh so a fresh clone can boot every service.
      POSTGRES_DB: trading_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d — runs ONCE on first container boot.
      # Order matters: 000_ creates the canonical DBs, service migrations
      # (mounted as 100_/200_/... below) then populate each DB's schema.
      - ./init_databases.sh:/docker-entrypoint-initdb.d/000_init_databases.sh:ro
      # Kept for backwards compatibility with an old deploy flow that
      # loaded user-config migrations at container-create time. These
      # target `trading_db` which the entrypoint already created.
      - ../../services/user-config/migrations:/docker-entrypoint-initdb.d/100_user_config_migrations
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  trading-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
