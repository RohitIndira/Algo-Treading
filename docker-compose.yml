version: '3.9'

services:
  # ===== INFRASTRUCTURE SERVICES =====
  
  postgres:
    image: postgres:15-alpine
    container_name: trading-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deployments/docker/init_all_schemas.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: mongo:7-alpine
    container_name: trading-mongodb
    hostname: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: trading_db
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - trading-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: trading-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    depends_on:
      - zookeeper
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: trading-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - trading-network
    restart: unless-stopped

  # ===== APPLICATION SERVICES =====

  api-gateway:
    build:
      context: ./api/gateway
      dockerfile: Dockerfile
    container_name: trading-api-gateway
    hostname: api-gateway
    ports:
      - "8081:8081"
    env_file:
      - ./api/gateway/.env.live
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-config:
        condition: service_started
    networks:
      - trading-network
    restart: unless-stopped

  user-config:
    build:
      context: ./services/user-config
      dockerfile: Dockerfile
    container_name: trading-user-config
    hostname: user-config
    ports:
      - "50051:50051"
    env_file:
      - ./services/user-config/.env.live
    environment:
      ENVIRONMENT: production
      GRPC_PORT: 50051
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-network
    restart: unless-stopped

  data-ingestion:
    build:
      context: ./services/data-ingestion
      dockerfile: Dockerfile
    container_name: trading-data-ingestion
    hostname: data-ingestion
    ports:
      - "50052:50052"
    env_file:
      - ./services/data-ingestion/.env.live
    environment:
      ENVIRONMENT: production
      GRPC_PORT: 50052
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - trading-network
    restart: unless-stopped

  rules-engine:
    build:
      context: ./services/rules-engine
      dockerfile: Dockerfile
    container_name: trading-rules-engine
    hostname: rules-engine
    ports:
      - "50053:50053"
    env_file:
      - ./services/rules-engine/.env.live
    environment:
      ENVIRONMENT: production
      GRPC_PORT: 50053
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-network
    restart: unless-stopped

  trade-execution:
    build:
      context: ./services/trade-execution
      dockerfile: Dockerfile
    container_name: trading-trade-execution
    hostname: trade-execution
    ports:
      - "50054:50054"
    env_file:
      - ./services/trade-execution/.env.live
    environment:
      ENVIRONMENT: production
      SERVICE_PORT: 50054
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - trading-network
    restart: unless-stopped

  risk-management:
    build:
      context: ./services/risk-management
      dockerfile: Dockerfile
    container_name: trading-risk-management
    hostname: risk-management
    ports:
      - "50055:50055"
    env_file:
      - ./services/risk-management/.env.live
    environment:
      ENVIRONMENT: production
      SERVICE_PORT: 50055
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-network
    restart: unless-stopped

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  redis-data:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
