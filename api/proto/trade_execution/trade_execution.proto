syntax = "proto3";

package trade_execution;

import "api/proto/common/common.proto";

option go_package = "github.com/RohitIndira/Algo-Treading/api/proto/trade_execution";

// Trade Execution Service
// Handles order execution via Odin API and order management
service TradeExecutionService {
  // Get order status by order ID
  rpc GetOrderStatus(GetOrderStatusRequest) returns (GetOrderStatusResponse);
  
  // Get all orders for a user with filters
  rpc GetUserOrders(GetUserOrdersRequest) returns (GetUserOrdersResponse);
  
  // Cancel a pending order
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  
  // Modify a pending order
  rpc ModifyOrder(ModifyOrderRequest) returns (ModifyOrderResponse);
  
  // Get order history with pagination
  rpc GetOrderHistory(GetOrderHistoryRequest) returns (GetOrderHistoryResponse);
  
  // Get order statistics for a user
  rpc GetOrderStatistics(GetOrderStatisticsRequest) returns (GetOrderStatisticsResponse);

  // LookupOrderMeta — resolves a broker_order_id to its Manthan lineage.
  //
  // Used by positions svc to enrich order.events (which only carry
  // broker_order_id) with signal_id + order_type so it can route
  // BUY fills to the right lot (per §7.1 of positions_service_design.md).
  //
  // For SL_SELL / EXIT orders, entry_signal_id + entry_broker_order_id
  // point to the ENTRY that spawned this SL — lets positions svc find
  // the specific MANTHAN lot to close under the separate-row-per-BUY
  // model (§11 Q3, ratified 2026-07-13).
  //
  // found=false when broker_order_id doesn't exist in manthan_orders,
  // i.e. it wasn't a Manthan-placed order (probably a user manual buy/sell
  // via broker app). Positions svc treats that as USER_MANUAL origin.
  rpc LookupOrderMeta(LookupOrderMetaRequest) returns (LookupOrderMetaResponse);

  // GetBrokerHoldings — returns a per-symbol net delivery quantity map for
  // the user's Indira account.
  //
  // Consumed by positions svc reconciler (Chunk P.G) every ~5 minutes to
  // compare against positions_db.positions and publish drift to
  // positions.drift.detected. Never auto-fixes — see the 2026-06-12 S4450
  // liquidation incident.
  //
  // Implementation delegates to BrokerAdapter.GetEffectiveHoldings, which
  // is freeQty-safe: it sums position-book NetQty (CNC delivery rows,
  // MIS/intraday filtered out) + holdings.Qty. That combination gives the
  // true delivery quantity regardless of pledge/T+0 lock state — see
  // broker_adapter.go:848-931.
  rpc GetBrokerHoldings(GetBrokerHoldingsRequest) returns (GetBrokerHoldingsResponse);

  // Health check
  rpc HealthCheck(common.HealthCheckRequest) returns (common.HealthCheckResponse);
}

// Order details
message Order {
  // Internal order ID
  string order_id = 1;
  
  // User and strategy information
  string user_id = 2;
  string strategy_id = 3;
  string event_id = 4;  // Market event that triggered this order
  
  // Stock information
  int64 stock_code = 5;
  common.Exchange exchange = 6;
  string symbol = 7;
  
  // Order details
  common.OrderType order_type = 8;
  common.OrderSide order_side = 9;
  int32 quantity = 10;
  double price = 11;  // For LIMIT orders
  
  // Stop loss and take profit
  double stop_loss = 12;
  double take_profit = 13;
  
  // Order validity
  string validity = 14;  // DAY, IOC, GTD, etc.
  
  // Order status
  common.OrderStatus status = 15;
  
  // Indira API integration
  string indira_order_id = 16;  // Order ID from Indira Securities API (ordId)
  string indira_response = 17;  // Raw response from Indira API
  
  // Execution details
  int32 filled_quantity = 18;
  double filled_price = 19;
  double commission = 20;
  double total_cost = 21;
  
  // Timestamps
  common.Timestamp created_at = 22;
  common.Timestamp updated_at = 23;
  common.Timestamp submitted_at = 24;  // When submitted to Odin
  common.Timestamp executed_at = 25;   // When filled
  
  // Error information
  string error_message = 26;
  string rejection_reason = 27;
  
  // Metadata
  map<string, string> metadata = 28;
  
  // Indira-specific fields
  string exchange_token = 29;   // Exchange token for Indira API (excToken)
  string instrument = 30;       // Instrument type: "STK", "OPT", "FUT", "IDX"
  int32 lot_size = 31;          // Lot size for the instrument
  int32 disclosed_qty = 32;     // Disclosed quantity
  bool amo = 33;                // After Market Order flag
  common.ProductType product_type = 34;  // Product type
}

// Order request message (published to RabbitMQ by Rules Engine)
message OrderRequest {
  // Request ID for idempotency
  string request_id = 1;
  
  // User and strategy
  string user_id = 2;
  string strategy_id = 3;
  string event_id = 4;
  
  // Stock information
  int64 stock_code = 5;
  common.Exchange exchange = 6;
  string symbol = 7;
  
  // Order details
  common.OrderType order_type = 8;
  common.OrderSide order_side = 9;
  int32 quantity = 10;
  double price = 11;
  
  // Stop loss and take profit
  double stop_loss = 12;
  double take_profit = 13;
  
  // Order validity
  string validity = 14;
  
  // Risk check results
  bool risk_approved = 15;
  double risk_score = 16;
  
  // Timestamp
  common.Timestamp timestamp = 17;
  
  // Retry information
  int32 retry_count = 18;
  
  // Indira-specific fields
  string exchange_token = 19;  // Exchange token (excToken)
  string instrument = 20;      // Instrument type
  int32 lot_size = 21;         // Lot size
  int32 disclosed_qty = 22;    // Disclosed quantity
  bool amo = 23;               // After Market Order
  common.ProductType product_type = 24;
}

// Get order status request
message GetOrderStatusRequest {
  string order_id = 1;
  string user_id = 2;  // For authorization
}

message GetOrderStatusResponse {
  bool success = 1;
  Order order = 2;
  common.Error error = 3;
}

// Order filter options
message OrderFilter {
  // Status filters
  repeated common.OrderStatus statuses = 1;
  
  // Exchange filters
  repeated common.Exchange exchanges = 2;
  
  // Date range
  common.Timestamp start_date = 3;
  common.Timestamp end_date = 4;
  
  // Stock filter
  repeated int64 stock_codes = 5;
  
  // Strategy filter
  repeated string strategy_ids = 6;
  
  // Order side filter
  repeated common.OrderSide order_sides = 7;
}

// Get user orders request
message GetUserOrdersRequest {
  string user_id = 1;
  OrderFilter filter = 2;
  common.PaginationRequest pagination = 3;
}

message GetUserOrdersResponse {
  bool success = 1;
  repeated Order orders = 2;
  common.PaginationResponse pagination = 3;
  common.Error error = 4;
}

// Cancel order request
message CancelOrderRequest {
  string order_id = 1;
  string user_id = 2;  // For authorization
  string reason = 3;   // Cancellation reason
  
  // Indira auth context for order cancellation
  common.IndiraAuthContext indira_auth = 4;
}

message CancelOrderResponse {
  bool success = 1;
  Order order = 2;
  string message = 3;
  common.Error error = 4;
}

// Modify order request
message ModifyOrderRequest {
  string order_id = 1;
  string user_id = 2;  // For authorization
  
  // Fields that can be modified
  optional int32 new_quantity = 3;
  optional double new_price = 4;
  optional common.OrderType new_order_type = 5;
  optional string new_validity = 6;
  optional double new_trigger_price = 7;
  optional int32 new_disclosed_qty = 8;
  
  // Indira auth context for order modification
  common.IndiraAuthContext indira_auth = 9;
}

message ModifyOrderResponse {
  bool success = 1;
  Order order = 2;
  string message = 3;
  common.Error error = 4;
}

// Get order history request
message GetOrderHistoryRequest {
  string user_id = 1;
  OrderFilter filter = 2;
  common.PaginationRequest pagination = 3;
  bool include_cancelled = 4;  // Include cancelled orders
}

message GetOrderHistoryResponse {
  bool success = 1;
  repeated Order orders = 2;
  common.PaginationResponse pagination = 3;
  common.Error error = 4;
}

// Order statistics
message OrderStatistics {
  string user_id = 1;
  
  // Overall statistics
  int32 total_orders = 2;
  int32 filled_orders = 3;
  int32 pending_orders = 4;
  int32 rejected_orders = 5;
  int32 cancelled_orders = 6;
  
  // Success rate
  double fill_rate_pct = 7;
  double rejection_rate_pct = 8;
  
  // Trading volume
  double total_traded_value = 9;
  double avg_order_value = 10;
  
  // Timing statistics
  double avg_execution_time_ms = 11;  // Average time from submission to fill
  double p95_execution_time_ms = 12;
  
  // By exchange
  map<string, int32> orders_by_exchange = 13;
  
  // By order type
  map<string, int32> orders_by_type = 14;
  
  // By strategy
  map<string, int32> orders_by_strategy = 15;
  
  // Date range
  common.Timestamp start_date = 16;
  common.Timestamp end_date = 17;
}

// Get order statistics request
message GetOrderStatisticsRequest {
  string user_id = 1;
  common.Timestamp start_date = 2;
  common.Timestamp end_date = 3;
  repeated string strategy_ids = 4;  // Filter by strategies
}

message GetOrderStatisticsResponse {
  bool success = 1;
  OrderStatistics statistics = 2;
  common.Error error = 3;
}

// Execution report (for internal use and streaming)
message ExecutionReport {
  string order_id = 1;
  string user_id = 2;
  string strategy_id = 3;
  
  // Execution details
  common.OrderStatus status = 4;
  int32 filled_quantity = 5;
  double filled_price = 6;
  double commission = 7;
  
  // Stock info
  int64 stock_code = 8;
  string symbol = 9;
  common.Exchange exchange = 10;
  
  // Timestamp
  common.Timestamp executed_at = 11;
  
  // Message
  string message = 12;
}

// Odin API response (internal data structure)
message OdinOrderResponse {
  bool success = 1;
  string order_id = 2;
  string status = 3;
  string message = 4;
  map<string, string> details = 5;
  string raw_response = 6;
}

// LookupOrderMeta — resolves a broker_order_id to its Manthan lineage.
// Consumed by positions svc to enrich order.events. See §6 of
// docs/positions_service_design.md.
message LookupOrderMetaRequest {
  string broker_order_id = 1;
}

message LookupOrderMetaResponse {
  // found=false → broker_order_id not in manthan_orders (user manual buy/sell
  // via broker app). Positions svc treats as origin=USER_MANUAL.
  bool   found                 = 1;

  // Populated only when found=true.
  string signal_id             = 2;   // this row's own signal_id
  string order_type            = 3;   // ENTRY | SL_SELL | EXIT | AMO
  string strategy_id           = 4;
  string user_id               = 5;

  // For SL_SELL / EXIT orders: the ENTRY that spawned this SL. Lets
  // positions svc find the specific MANTHAN lot to close under the
  // separate-row-per-BUY model (§11 Q3 in the design doc).
  // For ENTRY orders: equal to signal_id / broker_order_id respectively.
  string entry_signal_id       = 6;
  string entry_broker_order_id = 7;

  // Real avg fill price of this row (manthan_orders.avg_fill_price).
  // 0 when the fill hasn't landed yet OR the row is still PENDING /
  // REJECTED. Lets positions svc use the authoritative broker fill
  // price instead of falling back to the LIMIT price when its own
  // Kafka event arrived via REST_ORDERBOOK (which never carries fill
  // price). Prevents the entry_price = limit vs fill divergence
  // documented in the incident report on 2026-07-16.
  double avg_fill_price        = 9;

  // For ENTRY orders: the SL that's currently placed at the broker
  // for this entry (via manthan_orders.parent_order_id self-FK).
  // sl_trigger_price = 0 means "no SL row exists yet." Lets positions
  // svc close the Kafka-partition-ordering race where an SL event
  // arrives before its parent BUY event and would otherwise be
  // silently dropped — the BUY handler can now proactively pull the
  // SL from execution_db and apply it to the freshly-created position.
  // For SL_SELL / EXIT rows: 0 (self-reference; caller doesn't need it).
  double sl_trigger_price      = 10;
  string sl_broker_order_id    = 11;

  // Optional error detail when found=false due to non-NOT_FOUND reason
  // (DB unreachable etc.). NOT_FOUND itself sets found=false with nil error.
  common.Error error           = 8;
}

// GetBrokerHoldings — per-user snapshot of Indira delivery holdings.
// Consumed by positions svc reconciler (Chunk P.G).
message GetBrokerHoldingsRequest {
  string user_id = 1;
}

message GetBrokerHoldingsResponse {
  // success=false → auth lookup / broker fetch failed. Positions svc must
  // skip this user's sweep (NOT publish false BROKER_ONLY drifts).
  bool success = 1;

  // Per-symbol net delivery quantity. Keys are uppercased NSE dispSyms
  // ("KINGFA"), matching BrokerAdapter.GetEffectiveHoldings' convention.
  // Empty map = user has zero delivery holdings (a real, valid state).
  map<string, int32> holdings = 2;

  common.Error error = 3;
}
