syntax = "proto3";

package user_config;

import "api/proto/common/common.proto";

option go_package = "github.com/RohitIndira/Algo-Treading/api/proto/user_config";

// User Configuration Service
// Manages user trading strategies and preferences
service UserConfigService {
  // Create a new trading strategy
  rpc CreateStrategy(CreateStrategyRequest) returns (CreateStrategyResponse);
  
  // Update an existing strategy
  rpc UpdateStrategy(UpdateStrategyRequest) returns (UpdateStrategyResponse);
  
  // Delete a strategy
  rpc DeleteStrategy(DeleteStrategyRequest) returns (DeleteStrategyResponse);
  
  // Get a specific strategy
  rpc GetStrategy(GetStrategyRequest) returns (GetStrategyResponse);
  
  // List all strategies for a user
  rpc ListUserStrategies(ListUserStrategiesRequest) returns (ListUserStrategiesResponse);
  
  // Activate a strategy
  rpc ActivateStrategy(ActivateStrategyRequest) returns (ActivateStrategyResponse);
  
  // Deactivate a strategy
  rpc DeactivateStrategy(DeactivateStrategyRequest) returns (DeactivateStrategyResponse);
  
  // Get user strategies in bulk (for internal services)
  rpc GetStrategiesByIDs(GetStrategiesByIDsRequest) returns (GetStrategiesByIDsResponse);
  
  // Health check
  rpc HealthCheck(common.HealthCheckRequest) returns (common.HealthCheckResponse);

  // Jobbing Strategy Configuration APIs
  // Configure jobbing strategy for multiple tokens for a user
  rpc ConfigureJobbingStrategy(ConfigureJobbingStrategyRequest)
      returns (ConfigureJobbingStrategyResponse);
  
  // Get all jobbing configurations for a user
  rpc GetJobbingConfigs(GetJobbingConfigsRequest)
      returns (GetJobbingConfigsResponse);
  
  // Get a single jobbing configuration for a user and token
  rpc GetJobbingConfig(GetJobbingConfigRequest)
      returns (GetJobbingConfigResponse);
  
  // Update a jobbing configuration
  rpc UpdateJobbingConfig(UpdateJobbingConfigRequest)
      returns (UpdateJobbingConfigResponse);
  
  // Delete a jobbing configuration
  rpc DeleteJobbingConfig(DeleteJobbingConfigRequest)
      returns (DeleteJobbingConfigResponse);
  
  // Enable a jobbing configuration
  rpc EnableJobbingConfig(EnableJobbingConfigRequest)
      returns (EnableJobbingConfigResponse);
  
  // Disable a jobbing configuration
  rpc DisableJobbingConfig(DisableJobbingConfigRequest)
      returns (DisableJobbingConfigResponse);
}

// Strategy condition filters
message StrategyConditions {
  // Match ALL news events (overrides all other conditions except impact_score_threshold)
  // Set this to true to create a catch-all strategy
  // Example: User sends "/all" to match every news event
  bool match_all_news = 1;
  
  // Impact score threshold (1-10)
  // Even with match_all_news=true, news must meet minimum impact score
  int32 impact_score_threshold = 2;
  
  // Sentiment filters (positive, neutral, negative)
  // Ignored if match_all_news=true
  repeated common.Sentiment sentiments = 3;
  
  // News categories to monitor
  // Ignored if match_all_news=true
  repeated string categories = 4;
  
  // Specific stocks to monitor (stock codes)
  // Ignored if match_all_news=true
  repeated int64 stock_codes = 5;
  
  // Price range filter
  // Ignored if match_all_news=true
  common.PriceRange price_range = 6;
  
  // Minimum trading volume threshold
  // Ignored if match_all_news=true
  int64 volume_threshold = 7;
  
  // Percentage change threshold (trigger if stock moves by this %)
  // Ignored if match_all_news=true
  double pct_change_threshold = 8;
  
  // Exchanges to monitor
  // Ignored if match_all_news=true
  repeated common.Exchange exchanges = 9;
}

// Trade execution configuration
message TradeConfig {
  // Order type (MARKET, LIMIT, etc.)
  common.OrderType order_type = 1;
  
  // Fixed quantity to trade
  int32 quantity = 2;
  
  // Maximum position size (in rupees)
  double max_position_size = 3;
  
  // Stop loss percentage
  double stop_loss_pct = 4;
  
  // Take profit percentage
  double take_profit_pct = 5;
  
  // Primary exchange for execution
  common.Exchange exchange = 6;
  
  // Order side (BUY/SELL)
  common.OrderSide order_side = 7;
  
  // Limit price (for LIMIT orders, optional)
  double limit_price = 8;
  
  // Validity (DAY, IOC, etc.)
  string validity = 9;
}

// Risk management limits
message RiskLimits {
  // Maximum number of trades per day
  int32 max_daily_trades = 1;
  
  // Maximum loss allowed per day (in rupees)
  double max_loss_per_day = 2;
  
  // Position sizing strategy
  common.PositionSizing position_sizing = 3;
  
  // Maximum portfolio exposure percentage
  double max_portfolio_exposure_pct = 4;
  
  // Maximum per-trade risk (in rupees)
  double max_per_trade_risk = 5;
  
  // Enable risk checks
  bool enable_risk_checks = 6;
}

// Trading strategy definition
message Strategy {
  // Unique strategy ID
  string strategy_id = 1;
  
  // User ID who owns this strategy
  string user_id = 2;
  
  // Strategy name
  string strategy_name = 3;
  
  // Strategy description
  string description = 4;
  
  // Is strategy active
  bool active = 5;
  
  // Strategy conditions
  StrategyConditions conditions = 6;
  
  // Trade configuration
  TradeConfig trade_config = 7;
  
  // Risk limits
  RiskLimits risk_limits = 8;
  
  // Creation timestamp
  common.Timestamp created_at = 9;
  
  // Last update timestamp
  common.Timestamp updated_at = 10;
  
  // Version for optimistic locking
  int32 version = 11;

  // Per-strategy trading mode. Defaults to "LIVE". Can be set to "PAPER"
  // to simulate trades for this strategy without sending real orders.
  string trading_mode = 12;  // "LIVE" or "PAPER"
}

// Create strategy request
message CreateStrategyRequest {
  string user_id = 1;
  string strategy_name = 2;
  string description = 3;
  StrategyConditions conditions = 4;
  TradeConfig trade_config = 5;
  RiskLimits risk_limits = 6;
  bool activate_immediately = 7;  // Activate strategy upon creation
}

message CreateStrategyResponse {
  bool success = 1;
  Strategy strategy = 2;
  common.Error error = 3;
}

// Update strategy request
message UpdateStrategyRequest {
  string strategy_id = 1;
  string user_id = 2;
  
  // Optional fields - only provided fields will be updated
  optional string strategy_name = 3;
  optional string description = 4;
  optional StrategyConditions conditions = 5;
  optional TradeConfig trade_config = 6;
  optional RiskLimits risk_limits = 7;
  
  // Version for optimistic locking
  int32 version = 8;
}

message UpdateStrategyResponse {
  bool success = 1;
  Strategy strategy = 2;
  common.Error error = 3;
}

// Delete strategy request
message DeleteStrategyRequest {
  string strategy_id = 1;
  string user_id = 2;  // For authorization
}

message DeleteStrategyResponse {
  bool success = 1;
  string message = 2;
  common.Error error = 3;
}

// Get strategy request
message GetStrategyRequest {
  string strategy_id = 1;
  string user_id = 2;  // For authorization
}

message GetStrategyResponse {
  bool success = 1;
  Strategy strategy = 2;
  common.Error error = 3;
}

// List user strategies request
message ListUserStrategiesRequest {
  string user_id = 1;
  bool active_only = 2;  // Filter to only active strategies
  common.PaginationRequest pagination = 3;
}

message ListUserStrategiesResponse {
  bool success = 1;
  repeated Strategy strategies = 2;
  common.PaginationResponse pagination = 3;
  common.Error error = 4;
}

// Activate strategy request
message ActivateStrategyRequest {
  string strategy_id = 1;
  string user_id = 2;  // For authorization
}

message ActivateStrategyResponse {
  bool success = 1;
  Strategy strategy = 2;
  common.Error error = 3;
}

// Deactivate strategy request
message DeactivateStrategyRequest {
  string strategy_id = 1;
  string user_id = 2;  // For authorization
}

message DeactivateStrategyResponse {
  bool success = 1;
  Strategy strategy = 2;
  common.Error error = 3;
}

// Get strategies by IDs (for internal services)
message GetStrategiesByIDsRequest {
  repeated string strategy_ids = 1;
}

message GetStrategiesByIDsResponse {
  bool success = 1;
  repeated Strategy strategies = 2;
  common.Error error = 3;
}

// ========================================================================
// Jobbing Strategy Configuration Messages
// ========================================================================

// Jobbing token configuration for a single stock
message JobbingTokenConfig {
  string token = 1;
  string symbol = 2;
  string exchange = 3;  // Default: "NSE"
  
  // Price range (required)
  double lower_range = 4;
  double higher_range = 5;
  
  // Order parameters (optional, will use defaults)
  double initial_buy_offset = 6;  // Default: 0.01
  double distance_continue = 7;   // Default: 0.01
  
  // Quantity (optional, will use defaults)
  int32 quantity_per_order = 8;  // Default: 1
  int32 max_quantity = 9;         // Default: 10
  
  // Trading mode (optional, defaults to LIVE)
  string trading_mode = 10;  // "LIVE" or "PAPER"
  
  // Enable/disable flag (optional, defaults to true)
  bool enabled = 11;
}

// Jobbing configuration model
message JobbingConfig {
  string id = 1;
  string user_id = 2;
  string strategy_id = 3;
  
  string token = 4;
  string symbol = 5;
  string exchange = 6;
  
  double lower_range = 7;
  double higher_range = 8;
  
  double initial_buy_offset = 9;
  double distance_continue = 10;
  
  int32 quantity_per_order = 11;
  int32 max_quantity = 12;
  
  string trading_mode = 13;
  
  bool enabled = 14;
  string enabled_at = 15;
  string disabled_at = 16;
  
  string created_at = 17;
  string updated_at = 18;
}

// Configure jobbing strategy for multiple tokens
message ConfigureJobbingStrategyRequest {
  string user_id = 1;
  repeated JobbingTokenConfig configs = 2;
}

message ConfigureJobbingStrategyResponse {
  bool success = 1;
  string message = 2;
  string user_id = 3;
  repeated JobbingConfig configs = 4;
  int32 total_count = 5;
  common.Error error = 6;
}

// Get all jobbing configurations for a user
message GetJobbingConfigsRequest {
  string user_id = 1;
  bool enabled_only = 2;  // Default: false
}

message GetJobbingConfigsResponse {
  bool success = 1;
  repeated JobbingConfig configs = 2;
  int32 total_count = 3;
  common.Error error = 4;
}

// Get a single jobbing configuration
message GetJobbingConfigRequest {
  string user_id = 1;
  string token = 2;
}

message GetJobbingConfigResponse {
  bool success = 1;
  JobbingConfig config = 2;
  common.Error error = 3;
}

// Update a jobbing configuration
message UpdateJobbingConfigRequest {
  string user_id = 1;
  string token = 2;
  
  // Optional updates
  optional double lower_range = 3;
  optional double higher_range = 4;
  optional double initial_buy_offset = 5;
  optional double distance_continue = 6;
  optional int32 quantity_per_order = 7;
  optional int32 max_quantity = 8;
  optional string trading_mode = 9;
  optional bool enabled = 10;
}

message UpdateJobbingConfigResponse {
  bool success = 1;
  JobbingConfig config = 2;
  common.Error error = 3;
}

// Delete a jobbing configuration
message DeleteJobbingConfigRequest {
  string user_id = 1;
  string token = 2;
}

message DeleteJobbingConfigResponse {
  bool success = 1;
  string message = 2;
  common.Error error = 3;
}

// Enable a jobbing configuration
message EnableJobbingConfigRequest {
  string user_id = 1;
  string token = 2;
}

message EnableJobbingConfigResponse {
  bool success = 1;
  string message = 2;
  common.Error error = 3;
}

// Disable a jobbing configuration
message DisableJobbingConfigRequest {
  string user_id = 1;
  string token = 2;
}

message DisableJobbingConfigResponse {
  bool success = 1;
  string message = 2;
  common.Error error = 3;
}
