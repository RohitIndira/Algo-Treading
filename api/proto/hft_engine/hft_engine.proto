syntax = "proto3";

package hft_engine;

option go_package = "github.com/RohitIndira/Algo-Treading/api/proto/hft_engine";

// HFTService is the gRPC contract between api-gateway and hft-engine, and
// between trade-execution and hft-engine for fill events.
//
// Phase 1: only Ping is implemented. Entry / Exit / GetState return stubs.
// Phase 2+ fills in real behaviour. The contract itself is stable from day 1
// so callers can integrate against it without breaking later.
service HFTService {
  // ── Health probe ──────────────────────────────────────────────────────
  rpc Ping(PingRequest) returns (PingResponse);

  // ── Strategy lifecycle (called by api-gateway on user action) ─────────
  //   Entry  — start running a strategy that's already been CREATED via
  //            POST /api/v1/strategies (i.e. its row exists in `strategies`).
  //   Exit   — halt a running strategy and cancel all resting orders.
  //   GetState — fetch current snapshot (positions, current chunk, halt
  //            reason, etc.) for the dashboard.
  rpc Entry(EntryRequest) returns (EntryResponse);
  rpc Exit(ExitRequest) returns (ExitResponse);
  rpc GetState(GetStateRequest) returns (GetStateResponse);

  // ── Server-streaming state push (Phase 6) ─────────────────────────────
  // api-gateway opens this stream per connected /ws/hft/state browser tab
  // and forwards every message over the WebSocket.
  rpc StreamState(StreamStateRequest) returns (stream StateSnapshot);

  // ── Fill ingest (Phase 5) ─────────────────────────────────────────────
  // trade-execution's OrderStatusService opens a client stream and pushes
  // every observed HFT order fill / cancel-ack / reject. Doing this as a
  // stream (vs unary call per event) saves the HTTP/2 setup cost per fill,
  // which matters when fills can burst at >100/s.
  rpc SubmitFills(stream FillEvent) returns (SubmitFillsAck);
}

// ─────────────────────────────────────────────────────────────────────────
// Messages
// ─────────────────────────────────────────────────────────────────────────

message PingRequest {}
message PingResponse {
  bool   pong    = 1;
  string version = 2;             // build SHA or semver
  int64  uptime_seconds = 3;
}

// Entry: ask the engine to start running a (previously created) strategy.
//
//   strategy_id   — UUID from the `strategies` table
//   side          — runtime override of the configured side: BUY | SELL | BOTH
//                   (if empty, engine uses the side stored in trade_config)
//   lots          — runtime override of max_buy_qty / max_sell_qty (per side)
//                   (if 0, engine uses values stored in trade_config)
message EntryRequest {
  string strategy_id = 1;
  string side        = 2;        // optional override
  int32  lots        = 3;        // optional override
}

message EntryResponse {
  bool   success     = 1;
  string status      = 2;        // "RUNNING" | "ALREADY_RUNNING" | "ERROR"
  string error       = 3;
  string strategy_id = 4;
}

message ExitRequest {
  string strategy_id = 1;
}

message ExitResponse {
  bool   success     = 1;
  string status      = 2;        // "STOPPED" | "NOT_RUNNING" | "ERROR"
  string error       = 3;
  string strategy_id = 4;
}

message GetStateRequest {
  string strategy_id = 1;
}

message GetStateResponse {
  bool          success  = 1;
  StateSnapshot snapshot = 2;
  string        error    = 3;
}

message StreamStateRequest {
  string strategy_id = 1;
}

// A point-in-time view of one running strategy. Same shape returned by
// GetState (unary) and StreamState (server-stream). The frontend renders
// this object directly on the dashboard.
message StateSnapshot {
  string strategy_id = 1;
  string user_id     = 2;
  string symbol      = 3;
  bool   active      = 4;
  string mode        = 5;          // "PAPER" | "LIVE"
  int64  started_at_unix = 6;
  int64  last_tick_at_unix = 7;

  double last_bid = 10;
  double last_ask = 11;

  SideSnapshot buy  = 20;
  SideSnapshot sell = 21;
}

message SideSnapshot {
  int32  position    = 1;
  int32  max_qty     = 2;
  bool   done        = 3;
  string halt_reason = 4;          // "" | "max_reached" | "price_band" | ...
  // Trigger gate state. False = waiting for LTP to cross buy/sell_trigger_price;
  // IDLE→PLACE is blocked. Flips true on the first qualifying tick (audit ARM)
  // and back to false on a cross-back while Position == 0 (audit DISARM).
  bool   armed       = 5;

  // Current chunk (nil unless one is in flight).
  ChunkSnapshot current = 10;

  // Closed chunks in placement order (for the dashboard timeline).
  repeated ChunkSnapshot history = 11;
}

message ChunkSnapshot {
  int32  seq             = 1;
  int32  qty             = 2;
  int32  filled          = 3;
  double limit_price     = 4;
  string broker_order_id = 5;
  string status          = 6;      // OPEN | PARTIAL | FILLED | CANCELLED
  int32  modify_count    = 7;
  int64  placed_at_unix  = 8;
}

// FillEvent — pushed by trade-execution's WS bridge per Indira broker event.
// One FillEvent per partial OR full fill, OR per cancel-ack, OR per reject.
//
//   event_type:
//     FILL    — broker reports executed qty for our order
//     CANCEL  — broker acknowledged cancel
//     REJECT  — broker rejected our order (place/modify/cancel)
//
//   fill_qty / fill_price populated when event_type=FILL.
//   reason populated when event_type=REJECT or CANCEL (if known).
message FillEvent {
  string strategy_id      = 1;     // resolved by trade-execution from broker_order_id
  string broker_order_id  = 2;
  string event_type       = 3;     // FILL | CANCEL | REJECT
  int32  fill_qty         = 4;     // incremental — sum across events to get total
  double fill_price       = 5;
  string reason           = 6;
  int64  exchange_time_us = 7;     // broker-supplied timestamp (μs since epoch)
}

message SubmitFillsAck {
  bool   success           = 1;
  int64  events_processed  = 2;
}
